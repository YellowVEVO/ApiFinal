<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Dashboard</h1>
  <h2>Books in the Library</h2>
  <button id="addBookButton">Add Book</button>
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Availability</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="booksTable">
      <!-- Books will be dynamically inserted here -->
    </tbody>
  </table>

  <!-- Add Book Modal -->
  <div id="addBookModal" style="display: none;">
    <h3>Add Book</h3>
    <form id="addBookForm">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required>
      <br>
      <label for="author">Author:</label>
      <input type="text" id="author" name="author" required>
      <br>
      <label for="genre">Genre:</label>
      <input type="text" id="genre" name="genre" required>
      <br>
      <label for="available">Available:</label>
      <select id="available" name="available">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
      <br>
      <button type="submit">Add Book</button>
      <button type="button" id="closeAddBookModal">Cancel</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    async function fetchBooks() {
      try {
        const response = await fetch(`${API_URL}/api/books`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch books');
        }

        const books = await response.json();
        const booksTable = document.getElementById('booksTable');

        booksTable.innerHTML = ''; // Clear the table before populating

        books.forEach(book => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td>${book.genre}</td>
            <td>${book.available ? 'Yes' : 'No'}</td>
            <td>
              <button onclick="editBook('${book._id}')">Edit</button>
              <button onclick="deleteBook('${book._id}')">Delete</button>
            </td>
          `;
          booksTable.appendChild(row);
        });
      } catch (error) {
        console.error('Error fetching books:', error);
      }
    }

    async function addBook(event) {
      event.preventDefault();
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const genre = document.getElementById('genre').value;
      const available = document.getElementById('available').value === 'true';

      try {
        const response = await fetch(`${API_URL}/api/books`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ title, author, genre, available })
        });

        if (!response.ok) {
          throw new Error('Failed to add book');
        }

        document.getElementById('addBookModal').style.display = 'none';
        fetchBooks(); // Refresh the book list
      } catch (error) {
        console.error('Error adding book:', error);
      }
    }

    async function deleteBook(bookId) {
      try {
        const response = await fetch(`${API_URL}/api/books/${bookId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to delete book');
        }

        fetchBooks(); // Refresh the book list
      } catch (error) {
        console.error('Error deleting book:', error);
      }
    }

    function editBook(bookId) {
      // Implement edit functionality here
      alert(`Edit functionality for book ID: ${bookId} is not implemented yet.`);
    }

    document.getElementById('addBookButton').addEventListener('click', () => {
      document.getElementById('addBookModal').style.display = 'block';
    });

    document.getElementById('closeAddBookModal').addEventListener('click', () => {
      document.getElementById('addBookModal').style.display = 'none';
    });

    document.getElementById('addBookForm').addEventListener('submit', addBook);

    // Fetch books when the page loads
    fetchBooks();
  </script>
</body>
</html>
